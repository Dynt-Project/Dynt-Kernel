# Created by epaxgaming on 31.07.26.
#
# grub config for the test boot, loads the kernel with the multiboot2
# protocol. later this will be replaced by the real bootloader.
#

set timeout=1
set default=0

# grub runs in a graphical framebuffer by default; hand the kernel the
# classic vga text mode (80x25) so the vga text driver can draw on screen
set gfxpayload=text

menuentry "Dynt-Kernel" {
    multiboot2 /boot/dynt-kernel
    boot
}
